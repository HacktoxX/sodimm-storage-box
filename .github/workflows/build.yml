name: STL-Dateien erzeugen

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Kalibrier-STLs exportieren
    runs-on: ubuntu-24.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: OpenSCAD installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad

      - name: Kalibrierkörper prüfen
        run: scripts/validate_slot_test.sh

      - name: Vollständigen Grundkörper prüfen
        run: scripts/validate_full_box.sh

      - name: Alle STL-Dateien exportieren
        run: scripts/export_all.sh

      - name: Erzeugte STL-Dateien hochladen
        uses: actions/upload-artifact@v7
        with:
          name: sodimm-storage-box-stl
          path: exports/**/*.stl
          if-no-files-found: error
          retention-days: 14
